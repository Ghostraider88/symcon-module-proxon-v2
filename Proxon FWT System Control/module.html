<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html,
        body {
            margin: 0;
            min-width: 0;
            background: transparent;
            color: #192b3d;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
        }

        .fwt-tile {
            width: 100%;
            overflow: auto;
            scrollbar-color: #aebdca transparent;
            padding-top: 36px;
            box-sizing: border-box;
        }

        .fwt-plant {
            display: block;
            width: 100%;
            min-width: 1180px;
            height: auto;
        }

        .fwt-rooms { margin: 16px 28px 28px; padding: 24px; border: 1px solid #dfe6ed; border-radius: 18px; background: #fff; }
        .fwt-rooms h2 { margin: 0 0 20px; font-size: 18px; }
        .fwt-room-floors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
        .fwt-floor { min-width: 0; padding: 18px; border-radius: 12px; background: #f8fafc; }
        .fwt-floor h3 { margin: 0 0 14px; font-size: 16px; }
        .fwt-room-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        .fwt-room-table th { font-size: 12px; font-weight: 500; color: #738397; }
        .fwt-room-table td, .fwt-room-table th { padding: 12px 7px; border-bottom: 1px solid #e8edf2; }
        .fwt-room-table td:first-child { overflow-wrap: anywhere; }
        .fwt-room-table td:not(:first-child) { white-space: nowrap; }
        .fwt-floor-scroll { overflow-x: auto; }
        .fwt-ptc { display: inline-block; min-width: 40px; padding: 5px 8px; border-radius: 12px; text-align: center; background: #edf2f5; color: #738397; }
        .fwt-ptc.active { background: #fff0e8; color: #ad654a; }
        @media (max-width: 1100px) { .fwt-room-floors { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<main class="fwt-tile" aria-label="PROXON FWT Anlagenvisualisierung">
    <!-- FWT_SVG -->
    <section class="fwt-rooms" id="fwt-rooms"></section>
</main>
<script>
const initialData = __INITIAL_DATA__;
const roomLabels = __ROOM_LABELS__;
let latestTileData = null;

function getReadQualityState(entry, intervalSeconds) {
    if (!entry || typeof entry !== 'object') return 'unknown';
    const lastSuccess = Number(entry.lastSuccessTimestamp) || 0;
    const lastAttempt = Number(entry.lastAttemptTimestamp) || 0;
    const maximumAge = Math.max(300, intervalSeconds > 0 ? intervalSeconds * 3 : 300) * 1000;
    if (lastSuccess <= 0) return lastAttempt > 0 ? 'failed' : 'unknown';
    if (Date.now() - lastSuccess > maximumAge) return 'stale';
    if (entry.lastAttemptSucceeded === false) return 'failed';
    return 'current';
}

function getGroupQuality(data, group) {
    const quality = data.systemControlQuality || {};
    return getReadQualityState(quality[group], Number(data.systemControlInterval) || 0);
}

function getMonitoringIdentifierQuality(data, ident) {
    const quality = data.monitoringQuality || {};
    const interval = Number(data.monitoringInterval) || 0;
    for (const entry of Object.values(quality)) {
        if (Array.isArray(entry.identifiers) && entry.identifiers.includes(ident)) {
            return getReadQualityState(entry, interval);
        }
    }
    return Object.keys(quality).length === 0 ? 'current' : 'unknown';
}

function getRoomReadingQuality(quality) {
    if (!quality || typeof quality !== 'object') return 'current';
    const timestamp = Number(quality.timestamp) || 0;
    if (timestamp <= 0) return quality.status || 'unknown';
    const maximumAge = Math.max(0, Number(quality.maximumAgeSeconds) || 300) * 1000;
    return Date.now() - timestamp > maximumAge ? 'stale' : quality.status || 'current';
}

function qualitySuffix(status) {
    if (status === 'current') return '';
    if (status === 'failed') return ' (' + (roomLabels.Failed || 'failed') + ')';
    if (status === 'unknown') return ' (' + (roomLabels.Unknown || 'unknown') + ')';
    return ' (' + (roomLabels.Stale || 'stale') + ')';
}

function updateRooms(data) {
    const section = document.getElementById('fwt-rooms');
    if (!section) return;
    const rooms = Array.isArray(data.rooms) ? data.rooms : [];
    section.replaceChildren();
    const element = (tag, text, className) => {
        const node = document.createElement(tag);
        if (text !== undefined) node.textContent = text;
        if (className) node.className = className;
        return node;
    };
    section.append(element('h2', roomLabels.Rooms));
    if (!rooms.length) {
        section.append(element('p', roomLabels['No rooms assigned']));
        return;
    }
    const floors = element('div', undefined, 'fwt-room-floors');
    section.append(floors);
    const number = (value, suffix = '', digits = 0) => typeof value === 'number' && Number.isFinite(value)
        ? new Intl.NumberFormat(undefined, { maximumFractionDigits: digits, minimumFractionDigits: digits }).format(value) + suffix : '—';
    for (const floor of ['EG', 'OG']) {
        const selected = rooms.filter((room) => room.floor === floor);
        if (!selected.length) continue;
        const card = element('article', undefined, 'fwt-floor');
        card.append(element('h3', roomLabels[floor === 'EG' ? 'Ground Floor' : 'Upper Floor']));
        const scroll = element('div', undefined, 'fwt-floor-scroll');
        const table = element('table', undefined, 'fwt-room-table');
        const head = element('thead');
        const headings = element('tr');
        for (const caption of ['Room', 'Actual / Target', 'CO2', 'Relative Humidity', 'PTC Active']) {
            const th = element('th', roomLabels[caption]);
            th.scope = 'col';
            headings.append(th);
        }
        head.append(headings);
        table.append(head);
        const body = element('tbody');
        for (const room of selected) {
            const row = element('tr');
            row.append(element('td', room.name));            const temperatureQuality = [room.quality?.temperature, room.quality?.setpoint]
                .map(getRoomReadingQuality).find((state) => state !== 'current') || 'current';
            const temperatureText = room.temperature == null && room.setpoint == null ? '\u2014'
                : number(room.temperature, '', 1) + ' / ' + number(room.setpoint, '', 1) + ' \u00B0C' + qualitySuffix(temperatureQuality);
            row.append(element('td', temperatureText));
            const co2Quality = getRoomReadingQuality(room.quality?.co2);
            row.append(element('td', number(room.co2, ' ppm') + (room.co2 == null ? '' : qualitySuffix(co2Quality))));
            const humidityQuality = getRoomReadingQuality(room.quality?.humidity);
            row.append(element('td', number(room.humidity, ' %', 1) + (room.humidity == null ? '' : qualitySuffix(humidityQuality))));
            const ptc = element('td');
            const ptcValue = room.ptc === true ? roomLabels.On : room.ptc === false ? roomLabels.Off : '\u2014';
            const ptcQuality = getRoomReadingQuality(room.quality?.ptc);
            ptc.append(element('span', ptcValue + (room.ptc == null ? '' : qualitySuffix(ptcQuality)), 'fwt-ptc' + (room.ptc === true ? ' active' : '')));
            row.append(ptc);
            body.append(row);
        }
        table.append(body);
        scroll.append(table);
        card.append(scroll);
        floors.append(card);
    }
}

function getValueAtPath(source, path) {
    return path.split('.').reduce((value, key) => value && value[key], source);
}

function getCurrentTileData(data) {
    const visibleData = {
        ...data,
        systemControl: { ...(data.systemControl || {}) },
        monitoring: { ...(data.monitoring || {}) }
    };
    const systemControlGroups = {
        ActualOperatingMode: 'FC4 register 23',
        ActualHeatPumpMode: 'FC4 register 241',
        HeatPumpModeCode: 'FC4 register 241',
        SupplyFanRPM: 'FC4 register 0',
        ExtractFanRPM: 'FC4 register 1',
        SupplyAirTemperature: 'FC4 register 195',
        ExtractAirTemperature: 'FC4 register 196',
        ExhaustAirTemperature: 'FC4 register 197',
        FreshAirTemperature: 'FC4 register 198',
        DeviceFilterRuntime: 'FC3 register 469',
        RecirculationFilterRuntime: 'FC3 register 468',
        BypassStatus: 'FC4 register 222',
        BypassOpen: 'FC4 register 222',
        DamperPosition: 'FC4 register 159',
        DamperPositionCode: 'FC4 register 159',
        CoolingEnabled: 'FC3 register 62',
        SupplyFanStageActual: 'FC4 register 154',
        ExtractFanStageActual: 'FC4 register 211'
    };
    if (Object.keys(data.systemControlQuality || {}).length > 0) {
        for (const [ident, group] of Object.entries(systemControlGroups)) {
            if (getGroupQuality(data, group) !== 'current') visibleData.systemControl[ident] = null;
        }
    }
    const monitoringInterval = Number(data.monitoringInterval) || 0;
    for (const entry of Object.values(data.monitoringQuality || {})) {
        if (!Array.isArray(entry.identifiers)) continue;
        if (getReadQualityState(entry, monitoringInterval) === 'current') continue;
        for (const ident of entry.identifiers) visibleData.monitoring[ident] = null;
    }
    return visibleData;
}

function formatBoundValue(element, value) {
    if (value === null || value === undefined || value === '') {
        return '—';
    }

    let formattedValue;
    if (element.dataset.format === 'boolean-de') {
        formattedValue = value ? 'Freigegeben' : 'Gesperrt';
    } else if (element.dataset.format === 'boolean') {
        const enabled = typeof translate === 'function' ? translate('Enabled') : 'Enabled';
        const blocked = typeof translate === 'function' ? translate('Blocked') : 'Blocked';
        formattedValue = value ? enabled : blocked;
    } else if (typeof value === 'number' && Number.isFinite(value)) {
        const digits = Number.parseInt(element.dataset.digits || '0', 10);
        formattedValue = new Intl.NumberFormat(undefined, {
            minimumFractionDigits: digits,
            maximumFractionDigits: digits
        }).format(value);
    } else {
        formattedValue = String(value);
    }

    return (element.dataset.prefix || '') + formattedValue + (element.dataset.suffix || '');
}

function updateBoundValues(data) {
    document.querySelectorAll('[data-bind]').forEach((element) => {
        const value = getValueAtPath(data, element.dataset.bind);
        const optionalRow = element.closest('[data-hide-if-empty]');
        if (optionalRow) {
            const unavailable = value === null || value === undefined || value === '';
            const emptyCode = optionalRow.hasAttribute('data-hide-if-zero') && !unavailable && Number(value) === 0;
            optionalRow.style.display = unavailable || emptyCode ? 'none' : '';
        }
        element.textContent = formatBoundValue(element, value);
    });
}

function updateFanAnimation(fanID, rpm) {
    const fan = document.getElementById(fanID);
    if (!fan) {
        return;
    }

    const blades = fan.querySelector('.blade');
    const isRunning = typeof rpm === 'number' && Number.isFinite(rpm) && rpm > 0;
    if (blades) {
        blades.style.animationPlayState = isRunning ? 'running' : 'paused';
        if (isRunning) {
            blades.style.animationDuration = Math.max(0.18, Math.min(2.5, 1200 / rpm)) + 's';
        }
    }
}

function updateAirflow(data) {
    const svg = document.querySelector('.fwt-plant');
    if (!svg) {
        return;
    }

    const system = data.systemControl || {};
    const supplyRPM = system.SupplyFanRPM;
    const extractRPM = system.ExtractFanRPM;
    const airflowPaths = [
        { selector: '.supply-flow', rpm: supplyRPM },
        { selector: '.extract-flow', rpm: extractRPM }
    ];

    airflowPaths.forEach(({ selector, rpm }) => {
        const isRunning = typeof rpm === 'number' && Number.isFinite(rpm) && rpm > 0;
        const duration = isRunning ? Math.max(0.3, Math.min(3, 1200 / rpm)) : 1.6;
        svg.querySelectorAll(selector).forEach((path) => {
            path.style.animationDuration = duration + 's';
            path.style.animationPlayState = isRunning ? 'running' : 'paused';
        });
    });

    updateFanAnimation('supply-fan', supplyRPM);
    updateFanAnimation('extract-fan', extractRPM);
}

function updateCompressorAnimation(data) {
    const monitoring = data.monitoring || {};
    const rpm = monitoring.CompressorSpeed;
    const monitoringQualityAvailable = Object.keys(data.monitoringQuality || {}).length > 0;
    const compressorSpeedIsCurrent = !monitoringQualityAvailable
        || getMonitoringIdentifierQuality(data, 'CompressorSpeed') === 'current';
    const hasSpeed = compressorSpeedIsCurrent && typeof rpm === 'number' && Number.isFinite(rpm) && rpm >= 0;
    const isRunning = hasSpeed && rpm > 0;
    const plant = document.querySelector('.fwt-plant');
    const heatPumpMode = plant ? plant.dataset.heatPumpMode : 'unknown';
    const refrigerantIsMoving = isRunning && (heatPumpMode === '1' || heatPumpMode === '2');
    const statusText = !hasSpeed ? '—' : isRunning ? (roomLabels.Running || 'Running') : (roomLabels.Off || 'Off');
    const rpmText = hasSpeed
        ? new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 }).format(rpm) + ' rpm'
        : '— rpm';
    const duration = isRunning ? Math.max(0.28, Math.min(2.4, 1800 / rpm)) : 1.6;

    const state = document.getElementById('compressor-state');
    if (state) state.textContent = statusText;
    const overviewSpeed = document.getElementById('compressor-overview-state');
    if (overviewSpeed) overviewSpeed.textContent = rpmText;
    const rotor = document.getElementById('compressor-symbol-rotor');
    if (rotor) {
        rotor.style.animationDuration = duration + 's';
        rotor.style.animationPlayState = isRunning ? 'running' : 'paused';
    }

    const lampColor = !hasSpeed || !isRunning
        ? '#8497a8'
        : heatPumpMode === '1' ? '#de493e' : heatPumpMode === '2' ? '#287cbd' : '#8497a8';
    ['compressor-status-lamp-top'].forEach((id) => {
        const lamp = document.getElementById(id);
        if (lamp) lamp.setAttribute('fill', lampColor);
    });

    document.querySelectorAll('.refrigerant-moving').forEach((path) => {
        path.style.animationDuration = duration + 's';
        path.style.animationPlayState = refrigerantIsMoving ? 'running' : 'paused';
        path.style.opacity = refrigerantIsMoving ? '0.92' : '0';
    });
}

function updateDamper(data) {
    const system = data.systemControl || {};
    const position = system.DamperPositionCode;
    const hasPosition = Number.isInteger(position) && position >= 0 && position <= 4;
    const captions = ['EG', 'EG bevorzugt', 'ausgeglichen', 'OG bevorzugt', 'OG'];
    const caption = document.getElementById('damper-caption');

    document.querySelectorAll('.damper-step').forEach((step) => {
        step.classList.toggle('damper-active', Number(step.dataset.damperPosition) === position);
    });

    if (caption) {
        caption.textContent = hasPosition
            ? 'Schieberposition ' + position + ' · ' + captions[position]
            : 'Schieberposition: —';
    }

    const egShares = [0.9, 0.75, 0.5, 0.25, 0.1];
    const egShare = hasPosition ? egShares[position] : 0;
    const ogShare = hasPosition ? 1 - egShare : 0;
    const egMeter = document.getElementById('eg-flow-meter');
    const ogMeter = document.getElementById('og-flow-meter');
    const egBranch = document.getElementById('flow-branch-eg');
    const ogBranch = document.getElementById('flow-branch-og');

    if (egMeter) {
        egMeter.setAttribute('width', String(450 * egShare));
    }
    if (ogMeter) {
        ogMeter.setAttribute('width', String(450 * ogShare));
    }
    if (egBranch) {
        egBranch.style.strokeWidth = String(hasPosition ? 9 + egShare * 10 : 8);
    }
    if (ogBranch) {
        ogBranch.style.strokeWidth = String(hasPosition ? 9 + ogShare * 10 : 8);
    }

    const describeShare = (share) => !hasPosition ? '—' : share > 0.6
        ? 'bevorzugt'
        : share < 0.4 ? 'reduziert' : 'ausgeglichen';
    [
        ['og-branch-caption', ogShare],
        ['og-meter-caption', ogShare],
        ['eg-branch-caption', egShare],
        ['eg-meter-caption', egShare]
    ].forEach(([id, share]) => {
        const element = document.getElementById(id);
        if (element) {
            element.textContent = describeShare(share);
        }
    });
}

function updateBypass(data) {
    const isOpen = data.systemControl && data.systemControl.BypassOpen;
    const status = data.systemControl && data.systemControl.BypassStatus;
    const supplyRPM = data.systemControl && data.systemControl.SupplyFanRPM;
    const bypassFlowing = isOpen === true && typeof supplyRPM === 'number' && supplyRPM > 0;
    const statusElement = document.getElementById('bypass-status');
    const path = document.getElementById('bypass-path');
    const flow = document.getElementById('bypass-flow');
    const supplyCore = document.getElementById('supply-air-through-core');
    const supplyCoreFlow = document.getElementById('supply-core-flow');
    const supplyBeforeBypass = document.getElementById('supply-air-before-bypass');
    const supplyBeforeBypassFlow = document.getElementById('supply-pre-bypass-flow');
    const valve = document.getElementById('bypass-valve');
    const valveBlade = valve && valve.querySelector('path');

    if (statusElement) {
        statusElement.textContent = 'BYPASS · ' + (status || '—');
    }
    if (path) {
        path.style.stroke = isOpen === true ? '#159a69' : '#8497a8';
        path.setAttribute('marker-end', isOpen === true ? 'url(#arrowGreen)' : 'url(#arrowNeutral)');
    }
    if (supplyCore) supplyCore.style.opacity = isOpen === true ? '0.24' : '1';
    if (supplyCoreFlow) supplyCoreFlow.style.opacity = isOpen === true ? '0.12' : '0.92';
    if (supplyBeforeBypass) supplyBeforeBypass.style.opacity = isOpen === true ? '0.24' : '1';
    if (supplyBeforeBypassFlow) supplyBeforeBypassFlow.style.opacity = isOpen === true ? '0.12' : '0.92';
    if (flow) {
        flow.style.opacity = bypassFlowing ? '0.92' : '0';
        flow.style.animationDuration = typeof supplyRPM === 'number' && Number.isFinite(supplyRPM) && supplyRPM > 0
            ? Math.max(0.45, Math.min(3.5, 1200 / supplyRPM)) + 's'
            : '1.6s';
        flow.style.animationPlayState = bypassFlowing ? 'running' : 'paused';
    }
    if (valveBlade) {
        const valvePosition = isOpen === true
            ? 'M-7 7L7-7'
            : isOpen === false ? 'M-7 -7L7 7' : 'M-7 0L7 0';
        valveBlade.setAttribute('d', valvePosition);
    }
}

function updateFilterIndicators(data) {
    const system = data.systemControl || {};
    const indicators = [
        { key: 'SupplyFilterRemainingPercent', fill: 'supply-filter-fill', label: 'supply-filter-life', top: 350, bottom: 402 },
        { key: 'ExtractFilterRemainingPercent', fill: 'extract-filter-fill', label: 'extract-filter-life', top: 345, bottom: 394 }
    ];

    indicators.forEach(({ key, fill: fillId, label: labelId, top, bottom }) => {
        const percent = system[key];
        const hasValue = typeof percent === 'number' && Number.isFinite(percent) && percent >= 0 && percent <= 100;
        const fill = document.getElementById(fillId);
        const label = document.getElementById(labelId);
        const height = hasValue ? (bottom - top) * percent / 100 : 0;
        const color = !hasValue ? '#c7d1d8' : percent > 60 ? '#159a69' : percent > 25 ? '#dfa346' : '#de493e';

        if (fill) {
            fill.setAttribute('y', String(bottom - height));
            fill.setAttribute('height', String(height));
            fill.style.fill = color;
        }
        if (label) {
            label.textContent = hasValue ? Math.round(percent) + '%' : '—';
            label.style.fill = hasValue ? color : '#738397';
        }
    });
}

function updateHeatPumpMode(data) {
    const element = document.getElementById('heat-pump-mode');
    if (!element) {
        return;
    }

    element.classList.remove('status-heating', 'status-cooling', 'status-on', 'status-off', 'status-unknown');
    const system = data.systemControl || {};
    const monitoring = data.monitoring || {};
    const reportedMode = system.HeatPumpModeCode;
    let mode = Number.isInteger(reportedMode) && reportedMode >= 0 && reportedMode <= 3 ? reportedMode : null;
    let inferred = false;

    const systemQualityAvailable = Object.keys(data.systemControlQuality || {}).length > 0;
    const monitoringQualityAvailable = Object.keys(data.monitoringQuality || {}).length > 0;
    const inferenceInputsAreCurrent = (!systemQualityAvailable
        || (getGroupQuality(data, 'FC4 register 195') === 'current'
            && getGroupQuality(data, 'FC4 register 198') === 'current'))
        && (!monitoringQualityAvailable
            || getMonitoringIdentifierQuality(data, 'CompressorSpeed') === 'current');

    if (mode === null && inferenceInputsAreCurrent) {
        const compressorRPM = monitoring.CompressorSpeed;
        const supplyTemperature = system.SupplyAirTemperature;
        const freshTemperature = system.FreshAirTemperature;
        if (typeof compressorRPM === 'number' && Number.isFinite(compressorRPM) && compressorRPM > 0
            && typeof supplyTemperature === 'number' && Number.isFinite(supplyTemperature)
            && typeof freshTemperature === 'number' && Number.isFinite(freshTemperature)) {
            const temperatureDelta = supplyTemperature - freshTemperature;
            if (temperatureDelta > 1) {
                mode = 1;
                inferred = true;
            } else if (temperatureDelta < -1) {
                mode = 2;
                inferred = true;
            }
        }
    }

    const modeClass = ({ 0: 'status-off', 1: 'status-heating', 2: 'status-cooling', 3: 'status-off' })[mode] || 'status-unknown';
    element.classList.add(modeClass);
    const plant = document.querySelector('.fwt-plant');
    if (plant) plant.dataset.heatPumpMode = mode === null ? 'unknown' : String(mode);

    if (inferred) {
        element.textContent = mode === 1
            ? (roomLabels['Heating (inferred)'] || 'Heating*')
            : (roomLabels['Cooling (inferred)'] || 'Cooling*');
        element.setAttribute('title', roomLabels['Mode Inferred'] || 'Inferred from compressor speed and air temperatures');
    } else {
        element.removeAttribute('title');
        element.textContent = mode === 1
            ? (roomLabels.Heating || 'Heizen')
            : mode === 2
                ? (roomLabels.Cooling || 'Kühlen')
                : mode === 0
                    ? (roomLabels.Off || 'Aus')
                    : '—';
    }

    const color = ({ 0: '#8497a8', 1: '#de493e', 2: '#287cbd', 3: '#8497a8' })[mode] || '#8497a8';
    const softColor = ({ 0: '#b8c1c7', 1: '#efa79c', 2: '#9ec7df', 3: '#b8c1c7' })[mode] || '#b8c1c7';
    const softStop = document.getElementById('supply-mode-soft');
    const endStop = document.getElementById('supply-mode-end');
    if (softStop) softStop.style.stopColor = softColor;
    if (endStop) endStop.style.stopColor = color;
    const arrow = ({ 1: 'url(#arrowRed)', 2: 'url(#arrowBlue)' })[mode] || 'url(#arrowNeutral)';
    ['supply-air-to-branches', 'flow-branch-og', 'flow-branch-eg'].forEach((id) => {
        const path = document.getElementById(id);
        if (path) {
            path.style.stroke = color;
            if (id !== 'supply-air-to-branches') {
                path.setAttribute('marker-end', arrow);
            }
        }
    });

    const coilRoles = mode === 1
        ? { left: ['VERDAMPFER', '#287cbd', '#f4faff'], right: ['VERFLÜSSIGER', '#df493e', '#fff8f5'] }
        : mode === 2
            ? { left: ['VERFLÜSSIGER', '#df493e', '#fff8f5'], right: ['VERDAMPFER', '#287cbd', '#f4faff'] }
            : { left: ['WÄRMETAUSCHER', '#91a2af', '#f5f7f8'], right: ['WÄRMETAUSCHER', '#91a2af', '#f5f7f8'] };
    ['left', 'right'].forEach((side) => {
        const [role, color, fill] = coilRoles[side];
        const label = document.getElementById('coil-' + side + '-role');
        const frame = document.getElementById('coil-' + side + '-frame');
        const line = document.getElementById('coil-' + side + '-line');
        if (label) label.textContent = role;
        if (frame) {
            frame.style.stroke = color;
            frame.style.fill = fill;
        }
        if (line) line.style.stroke = color;
    });

    const activeMode = mode === 1 || mode === 2;
    const circuit = mode === 2
        ? {
            discharge: 'M526 660H476V575H314',
            liquid: 'M242 575V630H626',
            expansion: 'M740 575V630H678',
            suction: 'M774 575V660H560'
        }
        : {
            discharge: 'M560 660H610V603H716V575',
            liquid: 'M762 575V630H678',
            expansion: 'M260 575V630H626',
            suction: 'M296 575V606M296 626V660H526'
        };
    ['discharge', 'liquid', 'expansion', 'suction'].forEach((name) => {
        const path = document.getElementById('refrigerant-' + name);
        const flow = document.getElementById('refrigerant-flow-' + name);
        const isHighSide = name === 'discharge' || name === 'liquid';
        const stroke = activeMode ? (isHighSide ? '#df493e' : '#287cbd') : '#8497a8';
        const marker = activeMode
            ? (isHighSide ? 'url(#arrowHotSmall)' : 'url(#arrowColdSmall)')
            : 'url(#arrowRefNeutralSmall)';
        if (path) {
            path.setAttribute('d', circuit[name]);
            path.style.stroke = stroke;
            path.style.opacity = activeMode ? '0.96' : '0.4';
            path.removeAttribute('marker-start');
            path.removeAttribute('marker-end');
            if (name === 'expansion') {
                path.setAttribute('marker-start', activeMode ? 'url(#arrowColdStart)' : 'url(#arrowRefNeutralStart)');
            } else {
                path.setAttribute('marker-end', marker);
            }
        }
        if (flow) {
            flow.setAttribute('d', circuit[name]);
            flow.style.animationDirection = name === 'expansion' ? 'reverse' : 'normal';
        }
    });

    const compressorMode = document.getElementById('compressor-overview-mode');
    if (compressorMode) {
        compressorMode.textContent = mode === 1 ? 'HEIZEN' : mode === 2 ? 'KÜHLEN' : mode === 0 || mode === 3 ? 'STANDBY' : '—';
        compressorMode.style.fill = activeMode ? color : '#738397';
    }
    ['compressor-overview-state', 'compressor-overview-power'].forEach((id) => {
        const reading = document.getElementById(id);
        if (reading) reading.style.fill = activeMode ? color : '#192b3d';
    });
    const compressorSymbol = document.querySelectorAll('#compressor-symbol .compressor-symbol, #compressor-symbol .compressor-symbol-mark');
    const compressorColor = activeMode ? color : '#8497a8';
    compressorSymbol.forEach((shape) => {
        shape.style.stroke = compressorColor;
        if (shape.classList.contains('compressor-symbol')) shape.style.fill = activeMode ? (mode === 1 ? '#fff3f1' : '#eef7fc') : '#fff';
    });
}

function updateTileStatus(data) {
    const source = document.getElementById('monitoring-source-status');
    if (!source) return;
    const summarize = (quality, interval) => {
        const entries = Object.values(quality || {});
        if (!entries.length) return roomLabels.Unknown || 'unknown';
        const states = entries.map((entry) => getReadQualityState(entry, interval));
        const failed = states.filter((state) => state === 'failed').length;
        const stale = states.filter((state) => state === 'stale').length;
        const unknown = states.filter((state) => state === 'unknown').length;
        if (failed) return (roomLabels.Failed || 'failed') + ': ' + failed;
        if (stale) return (roomLabels.Stale || 'stale') + ': ' + stale;
        if (unknown) return (roomLabels.Unknown || 'unknown') + ': ' + unknown;
        return roomLabels.Current || 'current';
    };
    const parts = [];
    if (!data.connected) parts.push((roomLabels.Modbus || 'Modbus') + ': ' + (roomLabels.Disconnected || 'disconnected'));
    parts.push((roomLabels.Plant || 'Plant') + ': ' + summarize(data.systemControlQuality, Number(data.systemControlInterval) || 0));
    if (!data.monitoringSelected) {
        parts.push(roomLabels['Select a Monitoring instance'] || 'Select a Monitoring instance');
    } else {
        parts.push((roomLabels.Monitoring || 'Monitoring') + ': ' + summarize(data.monitoringQuality, Number(data.monitoringInterval) || 0));
        if (data.monitoring?.FaultStatusComplete === false) parts.push(roomLabels['Fault status incomplete'] || 'Fault status incomplete');
        if (data.monitoringLastReadTimestamp) {
            parts.push(new Date(Number(data.monitoringLastReadTimestamp)).toLocaleString());
        }
    }
    source.textContent = parts.join(' \u00b7 ');
}

function refreshTileQuality() {
    if (!latestTileData) return;
    const visibleData = getCurrentTileData(latestTileData);
    updateBoundValues(visibleData);
    updateAirflow(visibleData);
    updateDamper(visibleData);
    updateBypass(visibleData);
    updateFilterIndicators(visibleData);
    updateTileStatus(latestTileData);
    updateHeatPumpMode(visibleData);
    updateCompressorAnimation(visibleData);
    updateRooms(latestTileData);
}

function handleMessage(data) {
    if (typeof data === 'string') {
        try {
            data = JSON.parse(data);
        } catch (error) {
            return;
        }
    }

    if (!data || typeof data !== 'object' || Array.isArray(data)) {
        return;
    }

    latestTileData = data;
    const visibleData = getCurrentTileData(data);
    updateBoundValues(visibleData);
    updateAirflow(visibleData);
    updateDamper(visibleData);
    updateBypass(visibleData);
    updateFilterIndicators(visibleData);
    updateHeatPumpMode(visibleData);
    updateCompressorAnimation(visibleData);
    updateTileStatus(data);
    updateRooms(data);
}

window.handleMessage = handleMessage;
handleMessage(initialData);
window.setInterval(refreshTileQuality, 15000);
</script>

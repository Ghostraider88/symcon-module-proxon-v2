<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1260" role="img" aria-labelledby="title desc">
<title id="title">Kompakter FWT Kachelvorschlag</title>
<desc id="desc">Kompaktes, geräteorientiertes Anlagenbild nach dem offiziellen FWT-2-Aufbau: ein zentraler Geräteschnitt mit geführten Luftwegen, Wärmepumpenkarte, EG- und OG-Räumen und Diagnosewerten.</desc>
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f7f9fb"/><stop offset="1" stop-color="#edf2f6"/></linearGradient>
  <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#f9fbfc"/><stop offset="1" stop-color="#dce4ea"/></linearGradient>
  <marker id="greenArrow" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#17966c"/></marker>
  <marker id="amberArrow" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#df9c3b"/></marker>
  <marker id="blueArrow" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#3183b7"/></marker>
  <marker id="redArrow" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#df493e"/></marker>
  <style>
    .txt{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#172b3d}
    .muted{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#748398}
    .card{fill:#fff;stroke:#dce5ed;stroke-width:2}
    .section{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#718195;font-size:13px;font-weight:800;letter-spacing:1px}
    .label{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#21364a;font-size:13px;font-weight:750}
    .value{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#172b3d;font-size:19px;font-weight:750}
    .small{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#748398;font-size:11px}
    .air{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:2 14;opacity:.95}
  </style>
</defs>
<rect width="1500" height="1260" fill="url(#bg)"/>

<!-- Compact identity line; Symcon supplies the instance title itself. -->
<text class="muted" x="28" y="72" font-size="14" font-weight="800" letter-spacing="1.2">PROXON · FWT · GERÄTEANSICHT</text>
<rect x="1284" y="48" width="190" height="38" rx="19" fill="#eaf6ef" stroke="#bfdfcb"/>
<circle cx="1307" cy="67" r="6" fill="#42a56c"/><text class="txt" x="1322" y="72" font-size="13" font-weight="750">Heizen · aktiv</text>


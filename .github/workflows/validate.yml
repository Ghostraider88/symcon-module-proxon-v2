name: Validate Proxon library

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate library and module metadata
        run: php .tools/validate-library.php

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: Check isolated PHP regressions
        shell: bash
        run: |
          set -euo pipefail
          php .tools/check-room-mapping.php
          php .tools/check-configuration-retention.php
          php .tools/check-status-polling.php
          php .tools/check-monitoring-read-groups.php
          php .tools/check-control-input.php

      - name: Check visualization tile and polling configuration
        run: |
          node .tools/check-fwt-tile.js
          node .tools/check-polling-config.js
